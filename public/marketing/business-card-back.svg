<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="600" viewBox="0 0 1050 600" role="img" aria-labelledby="title">
  <title id="title">Magariyetu business card back</title>
  <rect width="1050" height="600" fill="#F6F4EE"/>
  <rect x="0" width="28" height="600" fill="#C98A2B"/>
  <image href="../brand/magariyetu-mark.png" x="822" y="44" width="128" height="128" preserveAspectRatio="xMidYMid meet"/>
  <text x="92" y="128" fill="#10233F" font-family="Arial, sans-serif" font-size="40" font-weight="700">YOUR NAME</text>
  <text x="92" y="176" fill="#3A527A" font-family="Arial, sans-serif" font-size="25">Dealer Partnerships · Magariyetu</text>
  <line x1="92" y1="220" x2="590" y2="220" stroke="#D4DBE7" stroke-width="3"/>
  <text x="92" y="286" fill="#10233F" font-family="Arial, sans-serif" font-size="27">+254 7XX XXX XXX</text>
  <text x="92" y="338" fill="#10233F" font-family="Arial, sans-serif" font-size="27">hello@magariyetu.co.ke</text>
  <text x="92" y="390" fill="#10233F" font-family="Arial, sans-serif" font-size="27">magariyetu.co.ke</text>
  <rect x="748" y="165" width="200" height="200" rx="12" fill="#10233F"/>
  <text x="788" y="256" fill="#E3B368" font-family="Arial, sans-serif" font-size="23" font-weight="700">SCAN</text>
  <text x="770" y="292" fill="#F6F4EE" font-family="Arial, sans-serif" font-size="18">QR CODE</text>
  <text x="704" y="424" fill="#3A527A" font-family="Arial, sans-serif" font-size="18">Replace this block with a QR code</text>
  <text x="92" y="510" fill="#9C6A1D" font-family="Arial, sans-serif" font-size="20">Replace all placeholder contact details before print.</text>
